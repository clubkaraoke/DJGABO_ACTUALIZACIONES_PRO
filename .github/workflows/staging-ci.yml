name: Staging CI

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: staging-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Run tests
        run: npm test

      - name: Build all workspaces
        run: npm run build
