<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos · ADMIN Perú</title><style>*{box-sizing:border-box}body{font:16px Arial;background:#0a0a0c;color:#fff;margin:0}header{display:flex;justify-content:space-between;padding:18px;background:#17171d}main{max-width:850px;margin:auto;padding:20px}section,article{background:#17171d;border:1px solid #333;border-radius:12px;padding:18px;margin:15px 0}a{color:#ffda38}button{margin:5px;background:#ffda38;color:#111;border:0;padding:10px 15px;border-radius:8px;cursor:pointer;font-weight:bold}input{padding:12px;background:#2e2e37;color:#fff;border:1px solid #555;border-radius:7px;max-width:100%}p,li{color:#bbb;line-height:1.4}img{display:block;max-width:100%;max-height:360px;margin:12px 0}label{display:block;margin:8px 0}.error{color:#ff8d8d}.state{color:#ffda38} [hidden]{display:none!important}</style></head><body><header><strong>ADMIN · PEDIDOS PERÚ</strong><a href="/admin">Configuración comercial</a></header><main><h1>Verificador de pagos</h1><p>LAB · Solo pedidos y comprobantes simulados. La aprobación libera los karaokes de prueba.</p><section id="login"><input id="pass" type="password" placeholder="Contraseña ADMIN" autocomplete="current-password"><button id="enter">Ingresar</button></section><div id="panel" hidden><button id="refresh">Actualizar pedidos</button><div id="orders"></div></div><p id="message" class="error"></p></main><script>
const $=id=>document.getElementById(id),el=(tag,t)=>{const e=document.createElement(tag);e.textContent=t||'';return e};let pass='',blobLinks=[];const money=c=>'S/ '+(c/100).toFixed(2);const labels={waiting:'Esperando comprobante',pending:'Pendiente de revisión',approved:'Aprobado',rejected:'Rechazado',expired:'Vencido'};async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'X-Admin-Password':pass,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}function msg(e){$('message').textContent=e.message}const button=(t,fn)=>{let b=el('button',t);b.onclick=fn;return b};async function load(){const q=await api('/api/admin/orders');blobLinks.forEach(URL.revokeObjectURL);blobLinks=[];const box=$('orders');box.replaceChildren();for(const o of q.orders){let a=el('article');a.append(el('h2',o.qty+' karaokes · '+money(o.amount)),el('p',o.name+(o.email?' · '+o.email:'')+' · '+new Date(o.created).toLocaleString('es-PE')),el('p',labels[o.status]+(o.receiptState==='resubmit'?' · Solicitud de nuevo comprobante':'')+' · PRUEBA'));let ul=el('ul');o.items.forEach(i=>ul.append(el('li',i.artist+' — '+i.title)));a.append(ul);for(const rec of o.receipts){const b=button('Ver comprobante '+new Date(rec.created).toLocaleTimeString('es-PE'),async()=>{try{const r=await fetch('/api/admin/orders/'+o.id+'/receipt/'+rec.id,{headers:{'X-Admin-Password':pass}});if(!r.ok)throw Error('No se pudo abrir');const src=URL.createObjectURL(await r.blob());blobLinks.push(src);const img=el('img');img.src=src;img.alt='Comprobante de prueba';b.after(img);b.disabled=true}catch(e){msg(e)}});a.append(b)}if(o.status==='pending'){let ref=el('input');ref.placeholder='Referencia única de prueba';let amount=el('input');amount.type='number';amount.step='0.01';amount.placeholder='Monto verificado (S/)';let check=el('input');check.type='checkbox';let label=el('label');label.append(check,' Confirmo el monto simulado');let controls=el('div');controls.append(ref,amount,label);const action=async(b)=>{try{await api('/api/admin/orders/'+o.id+'/review','POST',b);$('message').textContent='';await load()}catch(e){msg(e)}};controls.append(button('Aprobar prueba',()=>action({action:'approve',reference:ref.value,amount:Math.round(Number(amount.value)*100),confirmed:check.checked})),button('Solicitar otro comprobante',()=>action({action:'resubmit'})),button('Rechazar',()=>{const reason=prompt('Motivo del rechazo');if(reason)action({action:'reject',reason})}));a.append(controls)}box.append(a)}if(!q.orders.length)box.append(el('p','No hay pedidos todavía.'))}$('enter').onclick=async()=>{try{pass=$('pass').value;await load();$('login').hidden=true;$('panel').hidden=false;$('pass').value='';$('message').textContent=''}catch(e){pass='';msg(e)}};$('refresh').onclick=()=>load().catch(msg);setInterval(()=>{if(pass&&!document.activeElement?.matches('input,button'))load().catch(()=>{})},15000);
</script></body></html>
