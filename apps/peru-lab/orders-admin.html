<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificación Yape · ADMIN Perú</title><style>
:root{color-scheme:dark;--yellow:#ffda38;--muted:#aaaab6}*{box-sizing:border-box}body{font:15px Arial,sans-serif;background:#0b0b10;color:#f7f7f7;margin:0}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px;background:#15151b;border-bottom:1px solid #303039}header strong,a{color:var(--yellow)}main{max-width:930px;margin:auto;padding:20px}h1{font-size:28px;margin:12px 0}h2{font-size:19px}p{color:var(--muted);line-height:1.45;margin:8px 0}section,article{background:#17171d;border:1px solid #303039;border-radius:12px;padding:16px;margin:12px 0}article.pending{border-color:#6b5229;background:#201d18}.topline,.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.topline strong{color:var(--yellow);font-size:11px;letter-spacing:1px}.badge{border:1px solid #56504a;border-radius:20px;padding:5px 9px;font-size:11px;color:#ffc863}.badge.ok{border-color:#376744;color:#91e4a6}.body{display:grid;grid-template-columns:170px 1fr;gap:16px;margin:12px 0}.photo{display:block;width:100%;min-height:100px;max-height:240px;object-fit:contain;background:#08080b;border:1px solid #444;border-radius:8px;cursor:zoom-in}.empty{padding:16px;background:#101014;color:var(--muted);border:1px dashed #555;border-radius:8px;text-align:center}.amount{font-size:24px;font-weight:bold;color:#fff;margin:2px 0 8px}.detail{font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}button{font:600 13px Arial;background:var(--yellow);color:#151515;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}button.secondary{background:#303039;color:white}button.danger{background:#3b252a;color:#f9b7c1}button.approve{background:#64d587;color:#102719}button:disabled{opacity:.5;cursor:default}input{padding:10px;background:#24242b;color:white;border:1px solid #555;border-radius:7px;max-width:100%;font:inherit}label{display:block;font-size:12px;color:var(--muted)}label input{display:block;margin:5px 0;width:min(100%,320px)}details{margin-top:8px;font-size:13px;color:var(--muted)}summary{cursor:pointer}li{padding:3px 0}.error{color:#ff8d8d;font-size:13px}.status{color:#95dea2;font-size:13px}dialog{background:#101014;color:#fff;border:1px solid #555;border-radius:12px;max-width:95vw;max-height:95vh;padding:12px}dialog img{display:block;max-width:85vw;max-height:79vh;object-fit:contain}dialog::backdrop{background:#000c}.hint{font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:540px){.body{grid-template-columns:1fr}.photo{max-height:230px}.actions button{flex:1}main{padding:12px}}
</style><link rel="stylesheet" href="/admin-shell.css"></head><body><header><strong>DJGABO · ADMIN PERÚ</strong><a href="/admin/videos">Revisar MP4</a><a href="/admin">Configuración comercial</a></header><main><h1>Verificación Yape</h1><p>Comprobantes recibidos. Aprueba solo después de confirmar el dinero en tu app Yape.</p><p class="hint">LAB · Solo simulaciones de pago.</p><section id="login"><label>Contraseña ADMIN<input id="pass" type="password" autocomplete="current-password"></label><button id="enter">Ingresar</button></section><div id="panel" hidden><div class="toolbar"><h2 id="pendingTitle">Pendientes de verificación</h2><button class="secondary" id="refresh">Actualizar</button></div><div id="pending"></div><h2>Historial de pedidos</h2><div id="history"></div></div><p id="message" role="status" class="error"></p></main><dialog id="photoDialog"><div class="toolbar"><strong>Comprobante Yape</strong><button class="secondary" id="closePhoto">Cerrar</button></div><img id="bigPhoto" alt="Comprobante ampliado"></dialog>
<script src="/admin-shell.js"></script><script>
const $=id=>document.getElementById(id),el=(tag,text,klass)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(klass)e.className=klass;return e};
const money=c=>new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN'}).format(c/100), date=t=>new Intl.DateTimeFormat('es-PE',{timeZone:'America/Lima',dateStyle:'short',timeStyle:'short'}).format(t);
const labels={waiting:'Esperando comprobante',pending:'Comprobante recibido · por verificar',approved:'Aprobado',rejected:'Rechazado',expired:'Vencido'};let pass='',loading=false,revision='',imageUrls=new Map(),actionsInFlight=0;
const errorLabels={DUPLICATE_OPERATION:'Este número de operación ya fue aprobado.',RECEIPT_CHANGED:'El comprobante cambió. Actualiza y revísalo nuevamente.',NOT_PENDING:'Este pedido ya fue atendido.'};function msg(e){$('message').textContent=errorLabels[e.message]||e.message||'Error al actualizar';$('message').className='error'}
async function api(p,method='GET',body){const r=await fetch(p,{method,headers:{'X-Admin-Password':pass,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}function button(t,fn,klass){const b=el('button',t,klass);b.onclick=fn;return b}
async function loadPhoto(o,rec,container){if(!rec){container.append(el('div','Sin imagen adjunta','empty'));return}let source=imageUrls.get(rec.id);if(!source){try{const r=await fetch('/api/admin/orders/'+o.id+'/receipt/'+rec.id,{headers:{'X-Admin-Password':pass}});if(!r.ok)throw Error();source=URL.createObjectURL(await r.blob());imageUrls.set(rec.id,source)}catch{container.replaceChildren(el('p','No se pudo abrir la imagen. Actualiza.','error'));return}}const img=el('img',undefined,'photo');img.src=source;img.alt='Comprobante de Yape';img.title='Ampliar comprobante';img.tabIndex=0;const open=()=>{$('bigPhoto').src=source;$('photoDialog').showModal()};img.onclick=open;img.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};container.replaceChildren(img,el('p','Pulsa para ampliar','hint'))}
function card(o){const pending=o.status==='pending',rec=o.receipts[0],article=el('article',undefined,pending?'pending':'');const top=el('div',undefined,'topline'),badge=el('span',o.receiptState==='resubmit'&&pending?'Esperando nuevo comprobante':labels[o.status],'badge'+(o.status==='approved'?' ok':''));top.append(el('strong','VERIFICACIÓN YAPE'),badge);article.append(top);const body=el('div',undefined,'body'),photo=el('div'),detail=el('div');body.append(photo,detail);article.append(body);detail.append(el('p',money(o.amount),'amount'),el('p',o.qty+' karaoke'+(o.qty===1?'':'s'),'detail'),el('p','Cliente: '+o.name+(o.email?' · '+o.email:''),'detail'),el('p','Comprobante: '+(rec?date(rec.created):'—')+' · Pedido: '+date(o.created),'hint'));if(o.reason)detail.append(el('p',o.reason,'error'));const list=el('details');list.append(el('summary','Ver karaokes del pedido ('+o.qty+')'));const ul=el('ul');o.items.forEach(t=>ul.append(el('li',t.artist+' — '+t.title)));list.append(ul);detail.append(list);if(pending)loadPhoto(o,rec,photo);else if(rec)photo.append(button('Ver comprobante',()=>loadPhoto(o,rec,photo),'secondary'));else photo.append(el('div','Sin comprobante','empty'));if(!pending)return article;
article.append(el('p','Confirma en tu app Yape que recibiste '+money(o.amount)+' antes de aprobar.','hint'));
const label=el('label','N.º de operación Yape (opcional)'),ref=el('input');ref.placeholder='Opcional';ref.maxLength=80;label.append(ref);article.append(label);const controls=el('div',undefined,'actions'),confirmBox=el('div',undefined,'actions');confirmBox.hidden=true;const rejectBox=el('div');rejectBox.hidden=true;const reasonLabel=el('label','Motivo (visible para el cliente)'),reason=el('input');reason.value='Pago no confirmado';reason.maxLength=500;reasonLabel.append(reason);rejectBox.append(reasonLabel);
const setDisabled=disabled=>{article.querySelectorAll('button,input').forEach(e=>e.disabled=disabled);if(!disabled){approve.disabled=!rec;resubmit.disabled=o.receiptState==='resubmit'}};
const action=async data=>{actionsInFlight++;setDisabled(true);try{await api('/api/admin/orders/'+o.id+'/review','POST',data);$('message').className='status';$('message').textContent=data.action==='approve'?'Pago aprobado. Karaokes habilitados.':data.action==='reject'?'Pago rechazado.':'Nuevo comprobante solicitado.';await load(true)}catch(e){msg(e);setDisabled(false)}finally{actionsInFlight--}};
const approve=button('Aprobar y habilitar karaokes',()=>{approve.hidden=true;confirmBox.hidden=false;rejectBox.hidden=true},'approve'),resubmit=button('Solicitar otro comprobante',()=>action({action:'resubmit'}),'secondary');controls.append(approve,resubmit,button('Rechazar pago',()=>{rejectBox.hidden=!rejectBox.hidden;confirmBox.hidden=true;approve.hidden=false},'danger'));approve.disabled=!rec;resubmit.disabled=o.receiptState==='resubmit';confirmBox.append(button('Confirmar: recibí '+money(o.amount),()=>action({action:'approve',confirmed:true,reference:ref.value.trim()||null,receiptId:rec?.id}),'approve'),button('Cancelar',()=>{confirmBox.hidden=true;approve.hidden=false},'secondary'));rejectBox.append(button('Confirmar rechazo',()=>action({action:'reject',reason:reason.value.trim()||'Pago no confirmado'}),'danger'));article.append(controls,confirmBox,rejectBox);return article}
async function load(force=false){if(loading)return;loading=true;try{const q=await api('/api/admin/orders');const next=JSON.stringify(q.orders);if(!force&&next===revision)return;revision=next;const pending=q.orders.filter(o=>o.status==='pending'),history=q.orders.filter(o=>o.status!=='pending');$('pendingTitle').textContent='Pendientes de verificación ('+pending.length+')';$('pending').replaceChildren(...pending.map(card));$('history').replaceChildren(...history.map(card));if(!pending.length)$('pending').append(el('p','Sin pagos pendientes de verificación.'));if(!history.length)$('history').append(el('p','Aún no hay pedidos.'));}finally{loading=false}}
$('enter').onclick=async()=>{try{pass=$('pass').value;await load(true);$('login').hidden=true;$('panel').hidden=false;$('pass').value='';$('message').textContent=''}catch(e){pass='';msg(e)}};$('pass').onkeydown=e=>{if(e.key==='Enter')$('enter').click()};$('refresh').onclick=()=>load(true).catch(msg);$('closePhoto').onclick=()=>$('photoDialog').close();$('photoDialog').onclose=()=>$('bigPhoto').removeAttribute('src');setInterval(()=>{if(pass&&!$('photoDialog').open&&!actionsInFlight&&!document.activeElement?.matches('input,button'))load().catch(()=>{})},10000);
window.PeruAdmin.ready.then(async()=>{pass='session';await load(true);$('login').hidden=true;$('panel').hidden=false}).catch(msg);
</script></body></html>
