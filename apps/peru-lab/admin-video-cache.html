<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN · Videos MP4 Perú</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#0b0b0d;color:#f5f5f6;--yellow:#ffd400}*{box-sizing:border-box}body{margin:0}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1px solid #29292e}a,header strong{color:var(--yellow)}main{max-width:900px;padding:24px;margin:auto}article,section{padding:16px;background:#17171d;border:1px solid #33333b;border-radius:10px;margin:12px 0}h1{font-size:26px}h2{font-size:18px}p,small{color:#b9b9c2;line-height:1.5}button{padding:10px 14px;border:0;border-radius:7px;background:var(--yellow);color:#111;font-weight:bold;cursor:pointer}button:disabled{opacity:.4;cursor:default}button.secondary{background:#303039;color:#fff}input{padding:10px;border:1px solid #444;background:#25252b;color:#fff;border-radius:6px;max-width:100%;margin:8px}video{width:100%;max-height:400px;background:#000;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{color:#e6d064}.error{color:#ffa5a5}[hidden]{display:none!important}@media(max-width:600px){main{padding:12px}header{padding:12px}}
</style></head><body><header><strong>DJGABO · ADMIN PERÚ</strong><a href="/admin/orders">Verificación Yape</a><a href="/admin">Configuración</a></header><main><h1>Videos MP4 guardados</h1><p>Revisa una sola vez cada video convertido por un cliente. Confirma la canción, letras, audio y duración antes de aprobar para reutilizar en futuras compras.</p><section id="login"><label>Contraseña ADMIN<input type="password" id="pass" autocomplete="current-password"></label><button id="enter">Ingresar</button></section><div id="panel" hidden><button id="reload" class="secondary">Actualizar</button><h2 id="pendingTitle">Pendientes</h2><div id="pending"></div><h2 id="readyTitle">Aprobados</h2><div id="ready"></div></div><p id="message" role="status"></p></main><script>
const $=id=>document.getElementById(id),el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};let pass='';
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'X-Admin-Password':pass,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}
function msg(e){$('message').className='error';$('message').textContent=e.message}function card(t){const a=el('article');a.append(el('h2',t.artist+' — '+t.title),el('p',Math.round(t.size/1048576)+' MB · '+(t.status==='approved'?'Disponible para compradores':'Pendiente de revisión')));const b=el('button','Revisar video');b.className='secondary';a.append(b);b.onclick=()=>{b.hidden=true;const video=el('video');video.controls=true;video.preload='metadata';video.src=t.previewUrl;video.setAttribute('referrerpolicy','no-referrer');a.append(video);const note=el('p','Cargando datos del video…');a.append(note);const controls=el('div');controls.className='actions';const check=el('input');check.type='checkbox';const label=el('label');label.append(check,document.createTextNode(' Revisé canción, letras, audio y duración'));const approve=el('button','Aprobar MP4');approve.disabled=true;const reject=el('button','Rechazar archivo');reject.className='secondary';let valid=false;video.onloadedmetadata=()=>{valid=video.videoWidth===1280&&video.videoHeight===720&&Number.isFinite(video.duration)&&video.duration>0;note.textContent=video.videoWidth+' × '+video.videoHeight+' · '+Math.round(video.duration)+' segundos'+(valid?'':' · Formato no válido');approve.disabled=!valid||!check.checked};video.onerror=()=>{note.textContent='No se pudo reproducir. Actualiza para renovar el enlace.';valid=false;approve.disabled=true};check.onchange=()=>approve.disabled=!valid||!check.checked;async function review(action){approve.disabled=true;reject.disabled=true;try{await api('/api/admin/video-cache/'+t.id+'/'+t.version,'POST',{action,confirmed:check.checked&&valid});await load()}catch(e){msg(e);reject.disabled=false;approve.disabled=!valid||!check.checked}}approve.onclick=()=>review('approve');reject.onclick=()=>{if(confirm('¿Rechazar este video? Podrá generarse nuevamente.'))review('reject')};if(t.status==='pending'){controls.append(label,approve,reject);a.append(controls)}};return a}
async function load(){const j=await api('/api/admin/video-cache');const pending=j.items.filter(x=>x.status==='pending'),ready=j.items.filter(x=>x.status==='approved');$('pendingTitle').textContent='Pendientes ('+pending.length+')';$('readyTitle').textContent='Aprobados ('+ready.length+')';$('pending').replaceChildren(...pending.map(card));$('ready').replaceChildren(...ready.map(card));if(!pending.length)$('pending').append(el('p','Sin videos pendientes.'));if(!ready.length)$('ready').append(el('p','Aún no hay videos aprobados.'));if(!j.enabled)$('message').textContent='El almacenamiento MP4 aún no está configurado.'}
$('enter').onclick=async()=>{try{pass=$('pass').value;await load();$('pass').value='';$('login').hidden=true;$('panel').hidden=false}catch(e){pass='';msg(e)}};$('pass').onkeydown=e=>{if(e.key==='Enter')$('enter').click()};$('reload').onclick=()=>load().catch(msg);
</script></body></html>
