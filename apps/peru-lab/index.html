<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJGABO · Karaoke Perú LAB</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#0a0a0c;color:#f8fafc}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#101014;border-bottom:1px solid #2b2b32;padding:16px max(18px,calc((100% - 1150px)/2));display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:2}header strong{color:#ffda38}main{max-width:1150px;margin:auto;padding:32px 18px}.tag{font-size:12px;color:#ffda38;text-transform:uppercase;letter-spacing:2px}h1{font-size:clamp(26px,5vw,44px);margin:12px 0}p{color:#a6a6b1}input{width:100%;padding:15px;border:1px solid #33333b;border-radius:12px;background:#17171d;color:white;font-size:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}.card{display:flex;gap:11px;padding:12px;background:#15151b;border:1px solid #2a2a33;border-radius:12px;align-items:center}.cover{width:70px;height:70px;flex:none;object-fit:cover;border-radius:8px;background:#26262f}.info{min-width:0;flex:1}.track{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.artist,.format{font-size:12px;color:#b0b0be;margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:6px;margin-top:8px}button{border:0;background:#ffda38;color:#151512;border-radius:7px;padding:8px 12px;cursor:pointer;font-weight:bold}button.secondary{background:#303039;color:white}dialog{background:#131318;color:#fff;border:1px solid #444;border-radius:14px;width:min(94vw,790px);padding:14px}dialog::backdrop{background:#000b}iframe{border:0;width:100%;height:min(72vh,580px);background:#000}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}#more{display:block;margin:22px auto}#more[hidden]{display:none}#count{font-size:13px}#status{min-height:22px}#cartList li{padding:8px;border-bottom:1px solid #333}.cartNote{font-size:12px}.price{font-size:14px;color:#ffda38;font-weight:bold}.top-actions{display:flex;gap:8px;align-items:center}.top-actions a{color:#aaa;font-size:12px;text-decoration:none}.cart-line{display:flex;justify-content:space-between;align-items:center;gap:8px}.cart-line button{flex:none}.cart-summary{padding:14px;background:#22222a;border-radius:10px;margin:12px 0}.summary-row{display:flex;justify-content:space-between;gap:8px;margin:9px 0}.summary-total{font-weight:700;font-size:20px;color:#ffda38}.banner{padding:10px 14px;border:1px solid #5b4c19;border-radius:10px;background:#302713;color:#ffda38}.banner[hidden]{display:none}</style></head><body>
<header><strong>DJGABO · CLUB KARAOKE</strong><div class="top-actions"><a href="/checkout">Mis karaokes</a><a href="/admin">ADMIN</a><button class="secondary" id="cart">Carrito (0)</button></div></header><main><div class="tag">Perú · Laboratorio</div><h1>Karaokes por unidad</h1><p>MP3+CDG y WAV+CDG · Escucha el demo antes de elegir.</p><p class="price" id="unitPrice">Cargando precio…</p><div id="offers" class="banner" hidden></div><input id="search" placeholder="Busca por artista o canción…" autocomplete="off"><p id="count">Cargando catálogo…</p><p id="status"></p><section class="grid" id="grid"></section><button id="more" hidden>Ver más</button></main>
<dialog id="demo"><div class="modal-head"><strong id="demoTitle"></strong><button class="secondary" id="closeDemo">Cerrar</button></div><div id="frameBox"></div></dialog>
<dialog id="cartDialog"><div class="modal-head"><strong>Tu carrito de prueba</strong><button class="secondary" id="closeCart">Cerrar</button></div><ul id="cartList"></ul><section class="cart-summary" id="cartSummary" aria-live="polite"><p>Selecciona tus karaokes.</p></section><p id="paymentOptions"></p><button id="checkoutButton" disabled>Simular pago Yape</button><p class="cartNote">LAB: pagos y descargas comerciales todavía no habilitados.</p></dialog>
<script>
const $=id=>document.getElementById(id),grid=$('grid');let tracks=[],filtered=[],limit=48,selected=new Map(),generation=0,shop=null,quoteGeneration=0,lastQuote=null;const money=c=>new Intl.NumberFormat("es-PE",{style:"currency",currency:"PEN"}).format(c/100);const normalize=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function element(tag,cls,value){const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e}
function refresh(){const q=normalize($('search').value.trim());filtered=tracks.filter(t=>normalize(t.artist+' '+t.title).includes(q));$('count').textContent=filtered.length.toLocaleString('es-PE')+' karaokes';render()}
function render(){grid.replaceChildren();for(const t of filtered.slice(0,limit)){const card=element('article','card');let cover=element('div','cover','♫');if(t.cover){cover=element('img','cover');cover.src=t.cover;cover.alt='';cover.loading='lazy';cover.onerror=()=>{cover.removeAttribute('src')}}const info=element('div','info');info.append(element('div','track',t.title),element('div','artist',t.artist),element('div','format',t.format),element('div','price',shop?money(shop.unitPriceCents):'…'));const actions=element('div','actions'),play=element('button','', '▶ Demo'),add=element('button','secondary',selected.has(t.id)?'✓':'+');play.onclick=()=>openDemo(t);add.onclick=()=>{if(selected.has(t.id))selected.delete(t.id);else selected.set(t.id,t);add.textContent=selected.has(t.id)?'✓':'+';updateCart()};actions.append(play,add);info.append(actions);card.append(cover,info);grid.append(card)}$('more').hidden=limit>=filtered.length}
async function openDemo(t){const token=++generation;$('demoTitle').textContent=t.artist+' — '+t.title;$('frameBox').replaceChildren(element('p','','Preparando demo…'));$('demo').showModal();try{const r=await fetch('/api/preview/cdg/'+encodeURIComponent(t.id)+'/config');if(!r.ok)throw Error();const c=await r.json();if(token!==generation)return;const params=new URLSearchParams({embed:'1',audio:c.audioUrl,cdg:c.cdgUrl,title:t.title,start:String(c.startSeconds),duration:String(c.durationSeconds),cdgStart:String(c.sourceStartSeconds),quality:'sdf-pro',autoplay:'1',bgType:c.visualPreset.backgroundType,bg:c.visualPreset.backgroundValue});const iframe=element('iframe');iframe.title='Demo de '+t.title;iframe.src='/cdg-player/index.html?'+params;iframe.allow='autoplay; fullscreen';$('frameBox').replaceChildren(iframe)}catch{if(token===generation)$('frameBox').replaceChildren(element('p','','No se pudo preparar el demo.'))}}
$('closeDemo').onclick=()=>$('demo').close();$('demo').onclose=()=>{generation++;$('frameBox').replaceChildren()};$('search').oninput=()=>{limit=48;refresh()};$('more').onclick=()=>{limit+=48;render()};$('cart').onclick=()=>{renderCart();$('cartDialog').showModal();updateCart()};$('closeCart').onclick=()=>$('cartDialog').close();
document.getElementById("checkoutButton").onclick=()=>{sessionStorage.setItem("peru_cart",JSON.stringify([...selected.keys()]));location.href="/checkout"};function renderCart(){const items=[...selected.values()];$('cartList').replaceChildren(...items.map(t=>{const row=element('li','cart-line');const title=element('span','',t.artist+' — '+t.title);const remove=element('button','secondary','Quitar');remove.onclick=()=>{selected.delete(t.id);render();renderCart();updateCart()};row.append(title,remove);return row}));if(!items.length)$('cartList').append(element('li','','Tu carrito está vacío.'))}
async function updateCart(){const seq=++quoteGeneration;$('cart').textContent='Carrito ('+selected.size+')';const summary=$('cartSummary');summary.replaceChildren(element('p','','Calculando…'));$('paymentOptions').textContent='';try{const r=await fetch('/api/store/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[...selected.keys()]})});if(!r.ok)throw Error();const q=await r.json();if(seq!==quoteGeneration)return;lastQuote=q;document.getElementById("checkoutButton").disabled=!q.qty||!q.paymentMethods.yape;$('cart').textContent='Carrito ('+q.qty+') · '+money(q.totalCents);summary.replaceChildren();function row(label,value,cls=''){const div=element('div','summary-row '+cls);div.append(element('span','',label),element('span','',value));summary.append(div)}row(q.qty+' karaoke'+(q.qty===1?'':'s'),money(q.subtotalCents));if(q.discountCents)row(q.applied||'Descuento','− '+money(q.discountCents));row('Total',money(q.totalCents),'summary-total');if(q.qty)row('Precio por karaoke',money(q.unitPriceCents));const labels={yape:'Yape',plin:'Plin',transferencia:'Transferencia',tarjeta:'Tarjeta',paypal:'PayPal'};const enabled=Object.keys(q.paymentMethods).filter(k=>q.paymentMethods[k]).map(k=>labels[k]);$('paymentOptions').textContent=enabled.length?'Métodos configurados para pruebas: '+enabled.join(', '):'Métodos de pago pendientes de configuración.'}catch{if(seq===quoteGeneration)summary.replaceChildren(element('p','','No se pudo calcular el carrito. Intenta nuevamente.'))}}
async function loadShop(){const r=await fetch('/api/store/settings');if(!r.ok)throw Error();shop=await r.json();$('unitPrice').textContent=money(shop.unitPriceCents)+' por karaoke';const offers=shop.promotions.filter(t=>t.enabled).map(t=>'Desde '+t.minQty+': '+money(t.unitPriceCents)+' c/u');if(shop.offer.enabled)offers.push(shop.offer.title+' · '+shop.offer.discountPercent+'% de descuento');$('offers').textContent=offers.join('  ·  ');$('offers').hidden=!offers.length;render();updateCart()}
loadShop().catch(()=>$('unitPrice').textContent='Precio temporalmente no disponible.');
fetch('/api/catalog/peru/index.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(j=>{tracks=j.tracks;refresh();if(!tracks.length)$('status').textContent='Esperando la primera conexión al maestro TOP PERÚ.'}).catch(()=>{$('count').textContent='Catálogo temporalmente no disponible'});</script></body></html>
